[project]
name = "resolv"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic==2.3.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langgraph==1.2.18",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
optional = [
    "fastembed==0.9.1",
    "psycopg[binary]==3.3.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]
